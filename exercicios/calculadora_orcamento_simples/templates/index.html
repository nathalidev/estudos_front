<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Orçamento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

</head>
<body>
    <main>
        <form action="/calcular" method="POST">
                <div class="div-titulo">
                    <legend>Calculadora de Orçamento</legend>
                </div>
                <div class="conteudo-principal">
                    <div>
                        <label for="nome_cliente">Nome do cliente:</label>
                        <input type="text" id="nome_cliente" name="nome_cliente" required>
                    </div>
    
                    <div>
                        <label for="horas_trabalhadas">Horas trabalhadas:</label>
                        <input type="number" id="horas_trabalhadas" name="horas_trabalhadas" min="0" required>
                    </div>
    
                    <div>
                        <label for="valor_hora">Valor por hora:</label>
                        <input type="number" id="valor_hora" name="valor_hora" min="0" required>
                    </div>
    
                    <div>
                        <label for="desconto">Desconto(%):</label>
                        <input type="number" id="desconto" name="desconto" max="20" required>
                    </div>
                    <div id="botoes">
                        <button type="submit">Calcular</button>
                        <button type="reset">Limpar</button>
                    </div>
                </div>
        </form>
        <div id="resultado">
            <div class="conteudo-principal">
                <h2>Resultado:</h2>
            </div>
            <div class="div-titulo">
                {% if not erro %}
                    <p><strong>{{nome_cliente}}</strong></p>
                    <p>Valor bruto: R$ {{valor_bruto}}</p>
                    <p>Valor líquido: R$ {{valor_liquido}}</p>
                    <p>Desconto: R$ {{desconto}}</p>
                    <p>Horas trabalhadas: {{horas_trabalhadas}}</p>
                {% else %}
                    <p style="color: red;">Erro: {{ erro }}</p>
                {% endif %}
            </div>
        </div>
    </main>
</body>
</html>
