<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste de flexbox</title>
<link rel="stylesheet" href="css/treinando_alinhamentos.css">
</head>
<body>

<h3>A: row + nowrap (5 itens)</h3>
<div class="caixa a">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
</div>

<h3>B: row + wrap (8 itens)</h3>
<div class="caixa b">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
</div>

<h3>C: column + wrap (8 itens)</h3>
<div class="caixa c">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">8</div>
</div>

</body>
</html>
